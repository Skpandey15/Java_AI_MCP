name: release-images

on:
  workflow_run:
    workflows: ["platform-ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web-ui
            context: apps/web-ui
            image: ghcr.io/skpandey15/java-ai-mcp-web-ui
          - component: interview-orchestrator
            context: apps/interview-orchestrator
            image: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator
          - component: ai-service
            context: apps/ai-service
            image: ghcr.io/skpandey15/java-ai-mcp-ai-service

    steps:
      - name: Resolve source revision
        id: source
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          source_sha="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image for security verification
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ matrix.image }}:${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.title=${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ matrix.image }}:${{ steps.source.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.17.7
        with:
          image: ${{ matrix.image }}:${{ steps.source.outputs.tag }}
          format: spdx-json
          output-file: ${{ matrix.component }}-sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-sbom-${{ steps.source.outputs.sha }}
          path: ${{ matrix.component }}-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and main tags
        env:
          IMAGE: ${{ matrix.image }}
          IMMUTABLE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          docker tag "$IMAGE:$IMMUTABLE_TAG" "$IMAGE:main"
          docker push "$IMAGE:$IMMUTABLE_TAG"
          docker push "$IMAGE:main"

      - name: Resolve published digest
        id: published
        env:
          IMAGE: ${{ matrix.image }}
          IMMUTABLE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$IMMUTABLE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign image with GitHub OIDC
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
