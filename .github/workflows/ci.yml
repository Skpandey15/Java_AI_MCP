name: phase-1-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build

  interview-orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/interview-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew clean test bootJar --no-daemon

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.22
      - run: uv sync --frozen --extra dev
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev pytest --cov=app
