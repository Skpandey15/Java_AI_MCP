name: phase-1-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build

  interview-orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/interview-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode verify

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: pytest --cov=app
