name: platform-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  interview-orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/interview-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build and test with bounded dependency-download retry
        run: |
          for attempt in 1 2 3; do
            if ./gradlew clean test bootJar --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.22
      - run: uv sync --frozen --extra dev
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev pytest --cov=app --cov-fail-under=95
      - name: Enforce deterministic AI quality release gates
        run: uv run python -m evaluation.evaluator evaluation/release-dataset.jsonl --output ai-quality-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-quality-report
          path: apps/ai-service/ai-quality-report.json

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose including observability profile
        env:
          OPENAI_API_KEY: ci-placeholder
        run: docker compose -f platform/docker/docker-compose.yml --profile observability config --quiet
      - run: docker build -t online-interview-web-ui:ci apps/web-ui
      - run: docker build -t online-interview-orchestrator:ci apps/interview-orchestrator
      - name: Start orchestrator with PostgreSQL and verify health
        run: |
          docker network create orchestrator-smoke
          docker run --detach --name orchestrator-postgres --network orchestrator-smoke             --env POSTGRES_DB=online_interview             --env POSTGRES_USER=interview             --env POSTGRES_PASSWORD=interview             pgvector/pgvector:0.8.5-pg17-bookworm
          for attempt in $(seq 1 30); do
            if docker exec orchestrator-postgres pg_isready -U interview -d online_interview; then
              break
            fi
            sleep 1
          done
          docker run --detach --name orchestrator-smoke --network orchestrator-smoke             --publish 18080:8080             --env DATABASE_URL=jdbc:postgresql://orchestrator-postgres:5432/online_interview             --env DATABASE_USERNAME=interview             --env DATABASE_PASSWORD=interview             --env KEYCLOAK_ISSUER_URI=http://localhost:8090/realms/online-interview             --env KEYCLOAK_JWK_SET_URI=http://localhost:8090/realms/online-interview/protocol/openid-connect/certs             online-interview-orchestrator:ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health; then
              curl --fail --silent http://127.0.0.1:18080/actuator/prometheus > /dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs orchestrator-smoke
          exit 1
      - name: Stop orchestrator smoke environment
        if: always()
        run: |
          docker rm --force orchestrator-smoke orchestrator-postgres || true
          docker network rm orchestrator-smoke || true
      - run: docker build -t online-interview-ai-service:ci apps/ai-service
      - name: Start AI service container and verify health
        run: |
          docker run --detach --name ai-service-smoke --publish 18000:8000 online-interview-ai-service:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18000/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs ai-service-smoke
          exit 1
      - name: Stop AI service smoke container
        if: always()
        run: docker rm --force ai-service-smoke || true

  kubernetes-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.3
      - name: Render every Kustomize overlay
        run: |
          set -euo pipefail
          for environment in local dev uat prod; do
            kubectl kustomize "platform/kubernetes/overlays/$environment" > "/tmp/$environment.yaml"
            test -s "/tmp/$environment.yaml"
          done
          kubectl kustomize platform/gitops/argocd > /tmp/argocd.yaml
          test -s /tmp/argocd.yaml
      - name: Validate rendered Kubernetes schemas
        run: |
          set -euo pipefail
          docker run --rm -v /tmp:/manifests:ro \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas \
            /manifests/local.yaml /manifests/dev.yaml /manifests/uat.yaml /manifests/prod.yaml
      - name: Enforce Phase 4B manifest policies
        shell: pwsh
        run: ./platform/kubernetes/validate-manifests.ps1 -RenderedDirectory /tmp
      - name: Enforce Phase 4C GitOps policies
        shell: pwsh
        run: ./platform/gitops/validate-gitops.ps1 -RenderedDirectory /tmp -GitOpsDirectory platform/gitops/argocd
