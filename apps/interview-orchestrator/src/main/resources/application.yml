spring:
  profiles:
    default: local
  application:
    name: interview-orchestrator
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/online_interview}
    username: ${DATABASE_USERNAME:interview}
    password: ${DATABASE_PASSWORD:interview}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/online-interview}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/online-interview/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: ${spring.application.name}
    phase: phase-3a4-observability
    environment: ${spring.profiles.active:${spring.profiles.default}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    service-token: ${AI_SERVICE_TOKEN:local-ai-service-token}
  rag:
    minimum-similarity: ${RAG_MINIMUM_SIMILARITY:0.55}
    retrieval-limit: ${RAG_RETRIEVAL_LIMIT:8}
