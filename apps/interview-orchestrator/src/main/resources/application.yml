spring:
  profiles:
    default: local
  application:
    name: interview-orchestrator
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/online_interview}
    username: ${DATABASE_USERNAME:interview}
    password: ${DATABASE_PASSWORD:interview}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:20}
      minimum-idle: ${DATABASE_MIN_IDLE:5}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
    consumer:
      enable-auto-commit: false
      isolation-level: read_committed
    listener:
      ack-mode: record
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/online-interview}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/online-interview/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 20MB

spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    mail.smtp.connectiontimeout: 8000
    mail.smtp.timeout: 8000
    mail.smtp.writetimeout: 8000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  health:
    # The mail sender is only used on demand to email results; don't let Spring Boot's
    # auto-configured MailHealthIndicator probe SMTP on /actuator/health (it fails when no
    # credentials are set, which would wrongly mark the service DOWN).
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${APP_ENVIRONMENT:local}

info:
  app:
    name: ${spring.application.name}
    phase: phase-6d-ai-quality
    environment: ${spring.profiles.active:${spring.profiles.default}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Interview Team}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    service-token: ${AI_SERVICE_TOKEN:local-ai-service-token}
  rag:
    minimum-similarity: ${RAG_MINIMUM_SIMILARITY:0.55}
    retrieval-limit: ${RAG_RETRIEVAL_LIMIT:8}
  object-storage:
    enabled: ${OBJECT_STORAGE_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:interview}
    secret-key: ${MINIO_SECRET_KEY:interview-secret}
    bucket: ${MINIO_KNOWLEDGE_BUCKET:knowledge-documents}
    maximum-object-bytes: ${KNOWLEDGE_MAXIMUM_OBJECT_BYTES:10485760}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    session-start-per-minute: ${RATE_LIMIT_SESSION_START_PER_MINUTE:30}
    answer-autosave-per-minute: ${RATE_LIMIT_ANSWER_AUTOSAVE_PER_MINUTE:240}
    session-submit-per-minute: ${RATE_LIMIT_SESSION_SUBMIT_PER_MINUTE:30}
    ai-generation-per-minute: ${RATE_LIMIT_AI_GENERATION_PER_MINUTE:20}
    knowledge-mutation-per-minute: ${RATE_LIMIT_KNOWLEDGE_MUTATION_PER_MINUTE:20}
  mcp:
    authorization-secret: ${MCP_AUTHORIZATION_SECRET:local-mcp-authorization-secret-change-me}
    execution:
      timeout-seconds: ${MCP_EXECUTION_TIMEOUT_SECONDS:10}
      calls-per-minute: ${MCP_CALLS_PER_MINUTE:20}
  resilience:
    max-attempts: ${DOWNSTREAM_MAX_ATTEMPTS:3}
    retry-delay-millis: ${DOWNSTREAM_RETRY_DELAY_MS:200}
    circuit-failure-threshold: ${DOWNSTREAM_CIRCUIT_FAILURE_THRESHOLD:5}
    circuit-open-seconds: ${DOWNSTREAM_CIRCUIT_OPEN_SECONDS:30}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    topic: ${KAFKA_PLATFORM_EVENTS_TOPIC:platform.events.v1}
    maximum-attempts: ${OUTBOX_MAXIMUM_ATTEMPTS:8}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
