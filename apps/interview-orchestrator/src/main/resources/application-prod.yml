spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    root: WARN
    com.onlineinterview: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

info:
  app:
    environment: prod
    logging-policy: safe-operational

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL}
    service-token: ${AI_SERVICE_TOKEN}
  mcp:
    authorization-secret: ${MCP_AUTHORIZATION_SECRET}
  identity:
    reconciliation:
      enabled: ${IDENTITY_RECONCILIATION_ENABLED:true}
      interval-ms: ${IDENTITY_RECONCILIATION_INTERVAL_MS:300000}
    keycloak-admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL}
      realm: ${KEYCLOAK_ADMIN_REALM:online-interview}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
