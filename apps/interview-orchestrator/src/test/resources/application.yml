spring:
  datasource:
    url: jdbc:h2:mem:online_interview;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer

app:
  cors:
    allowed-origins: http://localhost:3000
