plugins {
    id 'java'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.onlineinterview'
version = '0.1.0-SNAPSHOT'

ext['jackson-bom.version'] = '2.21.4'
ext['tomcat.version'] = '10.1.55'
ext['postgresql.version'] = '42.7.12'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    implementation 'io.minio:minio:8.6.0'
    implementation 'org.apache.tika:tika-core:2.9.2'
    implementation 'org.apache.tika:tika-parsers-standard-package:2.9.2'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

def phaseQualityClasses = {
    files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, includes: [
            'com/onlineinterview/knowledge/**',
            'com/onlineinterview/mcp/**',
            'com/onlineinterview/common/resilience/**',
            'com/onlineinterview/messaging/**',
            'com/onlineinterview/profile/application/ProfileService*',
            'com/onlineinterview/profile/domain/UserProfile*',
            'com/onlineinterview/shared/security/TenantClaim*'
        ])
    })
}

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(phaseQualityClasses())
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    classDirectories.setFrom(phaseQualityClasses())
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

pitest {
    junit5PluginVersion = '1.2.3'
    targetClasses = [
        'com.onlineinterview.knowledge.application.*',
        'com.onlineinterview.knowledge.domain.*',
        'com.onlineinterview.mcp.application.*',
        'com.onlineinterview.mcp.domain.*',
        'com.onlineinterview.mcp.transport.*',
        'com.onlineinterview.common.resilience.*',
        'com.onlineinterview.messaging.application.*',
        'com.onlineinterview.messaging.domain.*',
        'com.onlineinterview.profile.application.ProfileService',
        'com.onlineinterview.profile.domain.UserProfile',
        'com.onlineinterview.shared.security.TenantClaim',
        'com.onlineinterview.ai.AiQuestionService'
    ]
    targetTests = [
        'com.onlineinterview.knowledge.*',
        'com.onlineinterview.mcp.*',
        'com.onlineinterview.common.resilience.*',
        'com.onlineinterview.messaging.*',
        'com.onlineinterview.profile.*',
        'com.onlineinterview.shared.security.TenantClaimTest',
        'com.onlineinterview.ai.AiQuestionServiceTest'
    ]
    mutationThreshold = 65
    coverageThreshold = 95
    threads = 4
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
}
