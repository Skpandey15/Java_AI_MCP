plugins {
    id 'java'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.onlineinterview'
version = '0.1.0-SNAPSHOT'

// Spring Boot 4.0's BOM manages Tomcat 11 / Jackson / PostgreSQL for Jakarta EE 11; do not
// override those for their own sake (it would break EE-version alignment). The one exception
// is a patched-CVE version bump: the BOM ships PostgreSQL 42.7.11, which Trivy flags for
// CVE-2026-54291 (fixed in 42.7.12). Override just that BOM property.
ext['postgresql.version'] = '42.7.12'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Boot 4.0 split RestClient auto-configuration (RestClient.Builder bean) into this module.
    implementation 'org.springframework.boot:spring-boot-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // Boot 4.0 moved Kafka auto-configuration into its own module; the starter pulls both
    // spring-kafka and spring-boot-kafka (KafkaAutoConfiguration -> KafkaTemplate bean).
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    implementation 'io.minio:minio:8.6.0'
    // Tika 3.2.2 clears CVE-2025-66516 / CVE-2025-54988 (PDF-parser XXE) in 2.9.2. The
    // Tika facade API used here (new Tika(), setMaxStringLength, parseToString) is unchanged.
    implementation 'org.apache.tika:tika-core:3.2.2'
    implementation 'org.apache.tika:tika-parsers-standard-package:3.2.2'
    // Boot 4 modularized Flyway auto-configuration behind this starter.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    // 0.8.15 understands JDK 25 bytecode (0.8.12 throws "Type T not present" on newer classfiles).
    toolVersion = '0.8.15'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

def phaseQualityClasses = {
    files(sourceSets.main.output.classesDirs.collect {
        fileTree(dir: it, includes: [
            'com/onlineinterview/knowledge/**',
            'com/onlineinterview/mcp/**',
            'com/onlineinterview/common/resilience/**',
            'com/onlineinterview/messaging/**',
            'com/onlineinterview/profile/application/ProfileService*',
            'com/onlineinterview/profile/domain/UserProfile*',
            'com/onlineinterview/shared/security/TenantClaim*',
            'com/onlineinterview/session/domain/**',
            'com/onlineinterview/interview/domain/**',
            'com/onlineinterview/review/domain/**'
        ])
    })
}

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(phaseQualityClasses())
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    classDirectories.setFrom(phaseQualityClasses())
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

pitest {
    junit5PluginVersion = '1.2.3'
    targetClasses = [
        'com.onlineinterview.knowledge.application.*',
        'com.onlineinterview.knowledge.domain.*',
        'com.onlineinterview.mcp.application.*',
        'com.onlineinterview.mcp.domain.*',
        'com.onlineinterview.mcp.transport.*',
        'com.onlineinterview.common.resilience.*',
        'com.onlineinterview.messaging.application.*',
        'com.onlineinterview.messaging.domain.*',
        'com.onlineinterview.profile.application.ProfileService',
        'com.onlineinterview.profile.domain.UserProfile',
        'com.onlineinterview.shared.security.TenantClaim',
        'com.onlineinterview.ai.AiQuestionService'
    ]
    targetTests = [
        'com.onlineinterview.knowledge.*',
        'com.onlineinterview.mcp.*',
        'com.onlineinterview.common.resilience.*',
        'com.onlineinterview.messaging.*',
        'com.onlineinterview.profile.*',
        'com.onlineinterview.shared.security.TenantClaimTest',
        'com.onlineinterview.ai.AiQuestionServiceTest'
    ]
    mutationThreshold = 65
    coverageThreshold = 95
    threads = 4
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
}
