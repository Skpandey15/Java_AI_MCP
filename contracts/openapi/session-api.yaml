openapi: 3.1.0
info:
  title: Online Interview Session API
  version: 1.0.0
paths:
  /api/v1/interviews/{interviewId}/questions:
    post: { summary: Add a manual question to an owned draft interview }
    get: { summary: List manual questions for an owned interview }
  /api/v1/candidate/assignments/{assignmentId}/sessions:
    post: { summary: Idempotently start or resume an assignment attempt }
  /api/v1/candidate/sessions/{sessionId}:
    get: { summary: Load server-authoritative session, questions and saved answers }
  /api/v1/candidate/sessions/{sessionId}/answers/{questionId}:
    put: { summary: Autosave an answer using its expected optimistic version }
  /api/v1/candidate/sessions/{sessionId}/submit:
    post: { summary: Submit an active session before server expiry }
  /api/v1/interviewer/submissions:
    get: { summary: Page through interviewer-owned submitted sessions }
  /api/v1/interviewer/submissions/{sessionId}:
    get: { summary: Load an owned submission for review }
  /api/v1/interviewer/submissions/{sessionId}/answers/{answerId}/score:
    put: { summary: Score a text answer and append an audit event }
  /api/v1/interviewer/submissions/{sessionId}/finalize:
    post: { summary: Atomically finalize and release score, percentage and outcome }
  /api/v1/candidate/sessions/{sessionId}/result:
    get: { summary: Return candidate-owned result details only after release }
