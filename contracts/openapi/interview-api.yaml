openapi: 3.1.0
info:
  title: Online Interview Workflow API
  version: 1.0.0
paths:
  /api/v1/interviews:
    post:
      summary: Create a draft interview
      description: The four question-composition counts must sum to questionCount.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInterviewRequest' }
      responses:
        '201': { description: Draft created }
        '403': { description: Interviewer role required }
    get:
      summary: List interviews owned by the authenticated interviewer
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Owned interviews }
  /api/v1/interviews/{interviewId}/publish:
    post:
      summary: Publish an owned draft
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: interviewId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Published }
        '404': { description: Interview not found or not owned }
        '409': { description: Invalid state transition }
  /api/v1/interviews/{interviewId}/assignments:
    post:
      summary: Assign a published interview to a candidate
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: interviewId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Assignment scheduled }
  /api/v1/candidate/interviews:
    get:
      summary: List the authenticated candidate's scheduled interviews
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Candidate assignments ordered by start time }
components:
  schemas:
    QuestionComposition:
      type: object
      required: [mcqSingle, mcqMultiple, shortText, longText]
      properties:
        mcqSingle: { type: integer, minimum: 0, maximum: 100 }
        mcqMultiple: { type: integer, minimum: 0, maximum: 100 }
        shortText: { type: integer, minimum: 0, maximum: 100 }
        longText: { type: integer, minimum: 0, maximum: 100 }
    CreateInterviewRequest:
      type: object
      required:
        - title
        - description
        - skills
        - difficulty
        - questionMode
        - durationMinutes
        - questionCount
        - questionComposition
        - passingPercentage
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        skills: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
        difficulty: { type: string, enum: [EASY, MEDIUM, HARD, MIXED] }
        questionMode: { type: string, enum: [MANUAL, DIRECT_LLM] }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        questionCount: { type: integer, minimum: 1, maximum: 100 }
        questionComposition: { $ref: '#/components/schemas/QuestionComposition' }
        passingPercentage: { type: integer, minimum: 1, maximum: 100 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
