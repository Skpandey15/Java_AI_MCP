openapi: 3.1.0
info:
  title: Online Interview Profile API
  version: 1.0.0
paths:
  /api/v1/me:
    get:
      summary: Get the authenticated application profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current profile
        '404':
          description: Profile registration is incomplete
  /api/v1/profiles/registration-complete:
    post:
      summary: Complete candidate application registration
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Candidate profile created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
