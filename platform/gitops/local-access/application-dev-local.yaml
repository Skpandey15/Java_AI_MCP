apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-interview-dev
  namespace: argocd
spec:
  project: online-interview
  source:
    repoURL: https://github.com/Skpandey15/Java_AI_MCP.git
    targetRevision: main
    path: platform/kubernetes/overlays/dev-local
  destination:
    server: https://kubernetes.default.svc
    namespace: online-interview-dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
