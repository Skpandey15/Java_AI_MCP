apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-interview-dev
  namespace: argocd
  annotations:
    # Slack notifications (see platform/gitops/local-access/argocd-notifications-cm.yaml).
    # Adjust the channel name to one your Slack bot has been invited to.
    notifications.argoproj.io/subscribe.on-deployed.slack: deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: deployments
spec:
  project: online-interview
  source:
    repoURL: https://github.com/Skpandey15/Java_AI_MCP.git
    targetRevision: main
    path: platform/kubernetes/overlays/dev-local
  destination:
    server: https://kubernetes.default.svc
    namespace: online-interview-dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
