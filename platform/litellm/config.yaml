model_list:
  - model_name: interview-question-model
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: knowledge-embedding-model
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  retry_after: 1

litellm_settings:
  drop_params: true
  request_timeout: 60
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Governance for non-local environments (requires a LiteLLM DATABASE_URL for key storage):
  #   1. Set general_settings.database_url so virtual keys and budgets persist.
  #   2. Mint a scoped virtual key per workload, e.g. the AI service:
  #        POST /key/generate { "models": ["interview-question-model","knowledge-embedding-model"],
  #                             "max_budget": 50, "budget_duration": "30d", "rpm_limit": 60 }
  #      and inject that key as LITELLM_API_KEY into the ai-service (never the master key).
  #   3. The master key is admin-only and must stay confined to this container.
