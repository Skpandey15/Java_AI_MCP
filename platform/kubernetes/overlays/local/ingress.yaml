apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-interview
  namespace: online-interview
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-ui
                port:
                  number: 80
    - host: api.interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: interview-orchestrator
                port:
                  number: 8080
    - host: auth.interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    - host: ai.interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8000
    - host: litellm.interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
