apiVersion: v1
kind: Service
metadata:
  name: web-ui
spec:
  type: NodePort
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: interview-orchestrator
spec:
  type: NodePort
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30081}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
spec:
  template:
    spec:
      containers:
        - name: web-ui
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-orchestrator
spec:
  template:
    spec:
      initContainers:
        - name: validate-migrated-schema
          imagePullPolicy: IfNotPresent
          # Schema validation boots the context and must EXIT. Kafka listeners and the
          # @Scheduled outbox poller (gated by app.messaging.enabled) are non-daemon and
          # would keep the JVM alive forever, so run this throwaway check with messaging
          # off. The main container below keeps messaging enabled.
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until java -jar /app/app.jar
              --spring.main.web-application-type=none
              --spring.flyway.enabled=false
              --app.messaging.enabled=false;
              do echo "Schema is not ready; retrying in 5 seconds"; sleep 5; done
      containers:
        - name: interview-orchestrator
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  template:
    spec:
      containers:
        - name: ai-service
          imagePullPolicy: IfNotPresent
