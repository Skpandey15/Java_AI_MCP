apiVersion: v1
kind: Service
metadata:
  name: web-ui
spec:
  type: NodePort
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: interview-orchestrator
spec:
  type: NodePort
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30081}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
spec:
  template:
    spec:
      containers:
        - name: web-ui
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-orchestrator
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-migration
          imagePullPolicy: Always
      containers:
        - name: interview-orchestrator
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  template:
    spec:
      containers:
        - name: ai-service
          imagePullPolicy: Always
