apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
images:
  - name: ghcr.io/skpandey15/java-ai-mcp-web-ui
    newName: online-interview-web-ui
    newTag: phase4b-local
  - name: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator
    newName: online-interview-orchestrator
    newTag: phase4b-local
  - name: ghcr.io/skpandey15/java-ai-mcp-ai-service
    newName: online-interview-ai-service
    newTag: phase4b-local
secretGenerator:
  - name: platform-secrets
    literals:
      - DATABASE_PASSWORD=interview
      - KEYCLOAK_DB_PASSWORD=keycloak
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - LITELLM_MASTER_KEY=local-litellm-key
      - AI_SERVICE_TOKEN=local-ai-service-token
      - OPENAI_API_KEY=replace-before-apply
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: local-patch.yaml
