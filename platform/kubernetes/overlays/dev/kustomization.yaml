apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-interview-dev
resources:
  - ../../base
  - vault-secret-store.yaml
  - external-secret.yaml
  - tls-ingress.yaml
images:
  - {name: ghcr.io/skpandey15/java-ai-mcp-web-ui, digest: sha256:d644f484ba7b9a2e01f3b755558fd78c68c3322cf5d5f8f8b806ae94661d1268}
  - {name: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator, digest: sha256:14ab2448119f66611b60aafab5843fcf144b353187305d0a15b42efe9496f593}
  - {name: ghcr.io/skpandey15/java-ai-mcp-ai-service, digest: sha256:5c95e5b89093c611d800ba42242165409dea9f77171bf1698a758303ca0a6235}
configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - APP_ENVIRONMENT=dev
      - CORS_ALLOWED_ORIGINS=https://interview.dev.example.com
      - KEYCLOAK_ISSUER_URI=https://auth.dev.example.com/realms/online-interview
      # Adaptive AI Interviewer dark-launch (dev only). uat/prod stay off until the pilot +
      # fairness review sign off. Kill-switch: set ADAPTIVE_ENABLED=false and re-sync.
      - ADAPTIVE_ENABLED=true
  - name: web-ui-runtime-config
    behavior: replace
    files:
      - config.js=web-ui-config.js
  - name: keycloak-realm
    behavior: replace
    files:
      - online-interview-realm.json
patches:
  - target: {kind: Namespace, name: online-interview}
    patch: |-
      - {op: replace, path: /metadata/name, value: online-interview-dev}
  - path: shared-patch.yaml
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [start-dev, --import-realm, --health-enabled=true, --hostname=https://auth.dev.example.com, --proxy-headers=xforwarded]
