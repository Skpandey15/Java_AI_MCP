apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-interview-dev
resources:
  - ../../base
  - vault-secret-store.yaml
  - external-secret.yaml
  - tls-ingress.yaml
images:
  - {name: ghcr.io/skpandey15/java-ai-mcp-web-ui, digest: sha256:44be142378141b69781fab5d6aeb57f30087396ec6077124a79b45234147a0e9}
  - {name: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator, digest: sha256:cb4f2531aea1a0f08cc92b558d6f12e5675efa60c388b9318bd78f784f1fb38d}
  - {name: ghcr.io/skpandey15/java-ai-mcp-ai-service, digest: sha256:a9205142f22a6fec453c370df860ea0798d6457e29b6fdc759466619029d7dff}
configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - APP_ENVIRONMENT=dev
      - CORS_ALLOWED_ORIGINS=https://interview.dev.example.com
      - KEYCLOAK_ISSUER_URI=https://auth.dev.example.com/realms/online-interview
  - name: web-ui-runtime-config
    behavior: replace
    files:
      - config.js=web-ui-config.js
  - name: keycloak-realm
    behavior: replace
    files:
      - online-interview-realm.json
patches:
  - target: {kind: Namespace, name: online-interview}
    patch: |-
      - {op: replace, path: /metadata/name, value: online-interview-dev}
  - path: shared-patch.yaml
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [start-dev, --import-realm, --health-enabled=true, --hostname=https://auth.dev.example.com, --proxy-headers=xforwarded]
