apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-interview-dev
# Single "dev" environment: local k3d, LAN HTTPS over nip.io so other devices on
# the same WiFi can reach it. Application images are the CI-published, cosign-signed
# ghcr images pinned by immutable digest; Argo CD (auto-sync from main) pulls them,
# so a merge to main auto-deploys dev via the pipeline's promote-dev job. The digests
# below are advanced automatically by that job; the TLS secret is issued by
# scripts/dev-ca.ps1, and the private ghcr images require a 'ghcr-pull' docker-registry
# secret in the online-interview-dev namespace (see docs/phase-4b-kubernetes.md).
resources:
  - ../../base
  - vault-secret-store.yaml
  - external-secret.yaml
  - ingress.yaml
  - gmail-smtp-egress.yaml
images:
  - {name: ghcr.io/skpandey15/java-ai-mcp-web-ui, digest: sha256:5c5df71adb9170be24f895079c5284048a5fb1b2260d90a4339b0562554f00b2}
  - {name: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator, digest: sha256:edbb035a30c786c27e3e34f24547017ac8e2ab60454f1b429b8c11a050aa79c1}
  - {name: ghcr.io/skpandey15/java-ai-mcp-ai-service, digest: sha256:536fc2f29e8b22e97484e36dc3130702ce2b83f4cc1ffc182eae754ea44b58e9}
configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - APP_ENVIRONMENT=dev
      - CORS_ALLOWED_ORIGINS=https://dev.interview.192.168.1.6.nip.io:8443
      - KEYCLOAK_ISSUER_URI=https://auth.dev.interview.192.168.1.6.nip.io:8443/realms/online-interview
      # Adaptive AI Interviewer dark-launch (dev only). Kill-switch: ADAPTIVE_ENABLED=false + re-sync.
      - ADAPTIVE_ENABLED=true
      - REQUIRE_VERIFIED_EMAIL=false
      - MAIL_ENABLED=true
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=sunil4.java.ai.expert@gmail.com
      - MAIL_FROM=sunil4.java.ai.expert@gmail.com
      - MAIL_FROM_NAME=Online Interview Platform
  - name: web-ui-runtime-config
    behavior: replace
    files:
      - config.js=web-ui-config.js
  - name: keycloak-realm
    behavior: replace
    files:
      - online-interview-realm.json
patches:
  - target: {kind: Namespace, name: online-interview}
    patch: |-
      - {op: replace, path: /metadata/name, value: online-interview-dev}
  - path: shared-patch.yaml
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [start-dev, --import-realm, --health-enabled=true, --hostname=https://auth.dev.interview.192.168.1.6.nip.io:8443, --proxy-headers=xforwarded]
