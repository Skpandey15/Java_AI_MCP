apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-interview-dev
resources:
  - ../../base
  - vault-secret-store.yaml
  - external-secret.yaml
  - tls-ingress.yaml
images:
  - {name: ghcr.io/skpandey15/java-ai-mcp-web-ui, digest: sha256:0dc7a925a247958c809e0ffb90be5ba0271254c9ed8411c21288e670502b7016}
  - {name: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator, digest: sha256:508e5178691e90a30b6d40fbca4b5c8a00b98a3a1685fe2cd532366b51a84087}
  - {name: ghcr.io/skpandey15/java-ai-mcp-ai-service, digest: sha256:f9606cdecbef4c3cc3681713dc82a3fb1bca69e4fc9d9e16c81d56fd6d14fe87}
configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - APP_ENVIRONMENT=dev
      - CORS_ALLOWED_ORIGINS=https://interview.dev.example.com
      - KEYCLOAK_ISSUER_URI=https://auth.dev.example.com/realms/online-interview
  - name: web-ui-runtime-config
    behavior: replace
    files:
      - config.js=web-ui-config.js
  - name: keycloak-realm
    behavior: replace
    files:
      - online-interview-realm.json
patches:
  - target: {kind: Namespace, name: online-interview}
    patch: |-
      - {op: replace, path: /metadata/name, value: online-interview-dev}
  - path: shared-patch.yaml
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [start-dev, --import-realm, --health-enabled=true, --hostname=https://auth.dev.example.com, --proxy-headers=xforwarded]
