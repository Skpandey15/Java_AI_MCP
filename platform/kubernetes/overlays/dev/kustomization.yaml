apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-interview-dev
resources:
  - ../../base
  - vault-secret-store.yaml
  - external-secret.yaml
  - tls-ingress.yaml
images:
  - {name: ghcr.io/skpandey15/java-ai-mcp-web-ui, digest: sha256:d3d92193c079787a36148a85dcfbbb8437a0bd4644e8f2e6b99f2ae26d5288e7}
  - {name: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator, digest: sha256:677ec24872207946fc2feb313ce90347aed27babfd1593908f53829bb1929ca1}
  - {name: ghcr.io/skpandey15/java-ai-mcp-ai-service, digest: sha256:42b71f7569e2417020ebb0505b0788a217c1689846b4b25710ddb1f0bdec08f4}
configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - APP_ENVIRONMENT=dev
      - CORS_ALLOWED_ORIGINS=https://interview.dev.example.com
      - KEYCLOAK_ISSUER_URI=https://auth.dev.example.com/realms/online-interview
  - name: web-ui-runtime-config
    behavior: replace
    files:
      - config.js=web-ui-config.js
  - name: keycloak-realm
    behavior: replace
    files:
      - online-interview-realm.json
patches:
  - target: {kind: Namespace, name: online-interview}
    patch: |-
      - {op: replace, path: /metadata/name, value: online-interview-dev}
  - path: shared-patch.yaml
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [start-dev, --import-realm, --health-enabled=true, --hostname=https://auth.dev.example.com, --proxy-headers=xforwarded]
