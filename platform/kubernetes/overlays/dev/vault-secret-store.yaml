apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-secret-store
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    vault:
      # LOCAL-ONLY: this dev overlay talks to the in-cluster Vault over plain HTTP
      # (no TLS / no caProvider) because the local k3d Vault is not served over TLS.
      # This is deliberate for the local dev stack and MUST NOT be copied to uat/prod,
      # which use https://vault.vault.svc:8200 with a caProvider (enforced by
      # platform/kubernetes/validate-manifests.ps1 for uat/prod).
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: online-interview-dev
          serviceAccountRef:
            name: external-secrets-vault
            audiences:
              - vault
