# Single LAN HTTPS ingress for the dev stack (nip.io hosts resolve to the
# desktop's Wi-Fi IP so other devices on the same WiFi can reach it).
# The IP is regenerated by scripts/deploy-dev.ps1 -LanIp when it changes;
# the TLS secret online-interview-dev-tls is issued out-of-band by
# scripts/dev-ca.ps1 (not tracked by Argo, so it is never pruned).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-interview-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: online-interview-dev-tls
      hosts:
        - dev.interview.192.168.1.6.nip.io
        - api.dev.interview.192.168.1.6.nip.io
        - auth.dev.interview.192.168.1.6.nip.io
        - ai.dev.interview.192.168.1.6.nip.io
        - litellm.dev.interview.192.168.1.6.nip.io
        - mail.dev.interview.192.168.1.6.nip.io
  rules:
    - host: dev.interview.192.168.1.6.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web-ui, port: {number: 80}}}
    - host: api.dev.interview.192.168.1.6.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: interview-orchestrator, port: {number: 8080}}}
    - host: auth.dev.interview.192.168.1.6.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: keycloak, port: {number: 8080}}}
    - host: ai.dev.interview.192.168.1.6.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: ai-service, port: {number: 8000}}}
    - host: litellm.dev.interview.192.168.1.6.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: litellm, port: {number: 4000}}}
    - host: mail.dev.interview.192.168.1.6.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: mailpit, port: {number: 8025}}}
