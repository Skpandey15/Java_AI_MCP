apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-interview-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: online-interview-dev-tls
      hosts:
        - dev.interview.localhost
        - api.dev.interview.localhost
        - auth.dev.interview.localhost
        - ai.dev.interview.localhost
        - litellm.dev.interview.localhost
  rules:
    - host: dev.interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web-ui, port: {number: 80}}
    - host: api.dev.interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: interview-orchestrator, port: {number: 8080}}
    - host: auth.dev.interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: keycloak, port: {number: 8080}}
    - host: ai.dev.interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ai-service, port: {number: 8000}}
    - host: litellm.dev.interview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: litellm, port: {number: 4000}}
