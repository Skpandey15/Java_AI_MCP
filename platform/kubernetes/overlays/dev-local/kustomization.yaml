apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-interview-dev
resources:
  - ../dev
  - ingress.yaml
configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - CORS_ALLOWED_ORIGINS=http://dev.interview.localhost:8081
      - KEYCLOAK_ISSUER_URI=http://auth.dev.interview.localhost:8081/realms/online-interview
  - name: web-ui-runtime-config
    behavior: replace
    files:
      - config.js=web-ui-config.js
  - name: keycloak-realm
    behavior: replace
    files:
      - online-interview-realm.json
patches:
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [start-dev, --import-realm, --health-enabled=true, --hostname=http://auth.dev.interview.localhost:8081]
