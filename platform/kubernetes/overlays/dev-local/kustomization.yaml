apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-interview-dev
resources:
  - ../dev
  - ingress.yaml
  - gmail-smtp-egress.yaml
configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - CORS_ALLOWED_ORIGINS=https://dev.interview.localhost:8443
      - KEYCLOAK_ISSUER_URI=https://auth.dev.interview.localhost:8443/realms/online-interview
      - REQUIRE_VERIFIED_EMAIL=false
      - MAIL_ENABLED=true
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=sunil4.java.ai.expert@gmail.com
      - MAIL_FROM=sunil4.java.ai.expert@gmail.com
      - MAIL_FROM_NAME=Online Interview Platform
  - name: web-ui-runtime-config
    behavior: replace
    files:
      - config.js=web-ui-config.js
  - name: keycloak-realm
    behavior: replace
    files:
      - online-interview-realm.json
patches:
  - target: {kind: Certificate, name: online-interview-tls}
    patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: online-interview-tls
  - target: {kind: Ingress, name: online-interview}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: online-interview
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [start-dev, --import-realm, --health-enabled=true, --hostname=https://auth.dev.interview.localhost:8443, --proxy-headers=xforwarded]
