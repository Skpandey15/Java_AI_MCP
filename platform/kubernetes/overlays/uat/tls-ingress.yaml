apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: online-interview-tls
spec:
  secretName: online-interview-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-staging
  dnsNames:
    - interview.uat.example.com
    - api.interview.uat.example.com
    - auth.uat.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: online-interview
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: online-interview-tls
      hosts:
        - interview.uat.example.com
        - api.interview.uat.example.com
        - auth.uat.example.com
  rules:
    - host: interview.uat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web-ui, port: {number: 80}}
    - host: api.interview.uat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: interview-orchestrator, port: {number: 8080}}
    - host: auth.uat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: keycloak, port: {number: 8080}}
