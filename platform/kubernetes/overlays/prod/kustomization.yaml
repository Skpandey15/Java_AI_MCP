apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-interview-prod
resources:
  - ../../base
  - external-secret.yaml
  - pod-disruption-budgets.yaml
images:
  - {name: ghcr.io/skpandey15/java-ai-mcp-web-ui, newTag: sha-b3ac0c34e03ebce5f02f26859d8c58a382646cf9}
  - {name: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator, newTag: sha-b3ac0c34e03ebce5f02f26859d8c58a382646cf9}
  - {name: ghcr.io/skpandey15/java-ai-mcp-ai-service, newTag: sha-b3ac0c34e03ebce5f02f26859d8c58a382646cf9}
configMapGenerator:
  - name: platform-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - APP_ENVIRONMENT=prod
      - LOG_LEVEL=INFO
      - CORS_ALLOWED_ORIGINS=https://interview.example.com
      - KEYCLOAK_ISSUER_URI=https://auth.example.com/realms/online-interview
  - name: web-ui-runtime-config
    behavior: replace
    files:
      - config.js=web-ui-config.js
  - name: keycloak-realm
    behavior: replace
    files:
      - online-interview-realm.json
patches:
  - target: {kind: Namespace, name: online-interview}
    patch: |-
      - {op: replace, path: /metadata/name, value: online-interview-prod}
  - path: production-patch.yaml
  - target: {kind: Deployment, name: keycloak}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [start, --import-realm, --health-enabled=true, --http-enabled=true, --hostname=https://auth.example.com, --proxy-headers=xforwarded]
