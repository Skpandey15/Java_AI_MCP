apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-interview
resources:
  - namespace.yaml
  - platform.yaml
  - migration-job.yaml
  - network-policies.yaml
  - runtime-dependencies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: online-interview
      app.kubernetes.io/managed-by: kustomize
configMapGenerator:
  - name: platform-config
    literals:
      - SPRING_PROFILES_ACTIVE=local
      - APP_ENVIRONMENT=local
      - LOG_LEVEL=INFO
      - DATABASE_URL=jdbc:postgresql://postgres:5432/online_interview
      - DATABASE_USERNAME=interview
      - DATABASE_MAX_POOL_SIZE=20
      - DATABASE_MIN_IDLE=5
      - DATABASE_CONNECTION_TIMEOUT_MS=3000
      - KEYCLOAK_ISSUER_URI=http://auth.interview.localhost:8081/realms/online-interview
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/online-interview/protocol/openid-connect/certs
      - AI_SERVICE_BASE_URL=http://ai-service:8000
      - LITELLM_BASE_URL=http://litellm:4000
      - INTERVIEW_QUESTION_MODEL=interview-question-model
      - KNOWLEDGE_EMBEDDING_MODEL=knowledge-embedding-model
      - INPUT_COST_PER_MILLION_TOKENS_USD=0.15
      - OUTPUT_COST_PER_MILLION_TOKENS_USD=0.60
      - RAG_MINIMUM_SIMILARITY=0.55
      - RAG_RETRIEVAL_LIMIT=8
      - MCP_EXECUTION_TIMEOUT_SECONDS=10
      - MCP_CALLS_PER_MINUTE=20
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OBJECT_STORAGE_ENABLED=true
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_KNOWLEDGE_BUCKET=knowledge-documents
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MESSAGING_ENABLED=true
      - CORS_ALLOWED_ORIGINS=http://interview.localhost:8081,http://localhost:30080
  - name: postgres-init
    files:
      - postgres-init.sh
  - name: keycloak-realm
    files:
      - online-interview-realm.json
  - name: litellm-config
    files:
      - config.yaml=litellm-config.yaml
  - name: web-ui-runtime-config
    files:
      - config.js=web-ui-config.js
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
images:
  - name: ghcr.io/skpandey15/java-ai-mcp-web-ui
    newTag: main
  - name: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator
    newTag: main
  - name: ghcr.io/skpandey15/java-ai-mcp-ai-service
    newTag: main
patches:
  - target:
      kind: ServiceAccount
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "-2"}
  - target:
      kind: Service
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "-2"}
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "-1"}
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "1"}
