apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  annotations:
    phase4b.online-interview/run-before-rollout: "true"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migration
    spec:
      restartPolicy: Never
      serviceAccountName: platform-runtime
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-for-postgres
          image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          command: [sh, -c, until pg_isready -h postgres -U interview; do sleep 2; done]
      containers:
        - name: migrate
          image: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator
          args:
            - --spring.main.web-application-type=none
            - --spring.flyway.enabled=true
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            - {name: DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: DATABASE_PASSWORD}}}
            - {name: AI_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: platform-secrets, key: AI_SERVICE_TOKEN}}}
            - {name: SPRING_FLYWAY_ENABLED, value: "true"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
