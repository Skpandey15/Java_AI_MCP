apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      serviceAccountName: platform-runtime
      securityContext:
        runAsNonRoot: true
        fsGroup: 70
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.5-pg17-bookworm@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
          args: ["-c", "max_connections=300", "-c", "shared_buffers=256MB"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: online_interview
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: DATABASE_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DATABASE_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: KEYCLOAK_DB_PASSWORD
          readinessProbe:
            exec:
              command: [sh, -c, pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/10-keycloak.sh
              subPath: postgres-init.sh
              readOnly: true
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, pg_ctl -D "$PGDATA" -m fast stop]
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      serviceAccountName: platform-runtime
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:0.8.5-pg17-bookworm@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
          command: [sh, -c, until pg_isready -h postgres -U interview; do sleep 2; done]
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1.0@sha256:c0675d484530e65446f38b28ea2e7854915c33afb0de5356899794410caf03be
          args: [start-dev, --import-realm, --health-enabled=true]
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: {secretKeyRef: {name: platform-secrets, key: KEYCLOAK_ADMIN_USERNAME}}}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: KEYCLOAK_ADMIN_PASSWORD}}}
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: jdbc:postgresql://postgres:5432/keycloak}
            - {name: KC_DB_USERNAME, value: keycloak}
            - {name: KC_DB_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: KEYCLOAK_DB_PASSWORD}}}
          startupProbe:
            httpGet: {path: /health/started, port: 9000}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 9000}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: platform-runtime
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable@sha256:65d84a2282137b4dc73bbe184650a7c807177c533e4223b3bfbc87963fe3fabe
          args: [--config, /app/config.yaml, --port, "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: platform-secrets, key: OPENAI_API_KEY}}}
            - {name: LITELLM_MASTER_KEY, valueFrom: {secretKeyRef: {name: platform-secrets, key: LITELLM_MASTER_KEY}}}
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app.kubernetes.io/name: ai-service
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
    spec:
      serviceAccountName: platform-runtime
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ai-service
          image: ghcr.io/skpandey15/java-ai-mcp-ai-service
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            # Scoped gateway key for the AI workload, never the LiteLLM master key.
            - {name: LITELLM_API_KEY, valueFrom: {secretKeyRef: {name: platform-secrets, key: LITELLM_API_KEY}}}
            - {name: AI_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: platform-secrets, key: AI_SERVICE_TOKEN}}}
          startupProbe:
            httpGet: {path: /api/v1/health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 750m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, sleep 10]
---
apiVersion: v1
kind: Service
metadata:
  name: interview-orchestrator
spec:
  selector:
    app.kubernetes.io/name: interview-orchestrator
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-orchestrator
spec:
  replicas: 1
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: interview-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: interview-orchestrator
    spec:
      serviceAccountName: platform-runtime
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: validate-migrated-schema
          image: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator
          command: [/bin/sh, -c]
          args:
            - >-
              until java -jar /app/app.jar
              --spring.main.web-application-type=none
              --spring.flyway.enabled=false;
              do echo "Schema is not ready; retrying in 5 seconds"; sleep 5; done
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            - {name: DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: DATABASE_PASSWORD}}}
            - {name: AI_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: platform-secrets, key: AI_SERVICE_TOKEN}}}
            - {name: MCP_AUTHORIZATION_SECRET, valueFrom: {secretKeyRef: {name: platform-secrets, key: MCP_AUTHORIZATION_SECRET}}}
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: REDIS_PASSWORD}}}
            - {name: MINIO_ACCESS_KEY, valueFrom: {secretKeyRef: {name: platform-secrets, key: MINIO_ACCESS_KEY}}}
            - {name: MINIO_SECRET_KEY, valueFrom: {secretKeyRef: {name: platform-secrets, key: MINIO_SECRET_KEY}}}
            - {name: SPRING_FLYWAY_ENABLED, value: "false"}
      containers:
        - name: interview-orchestrator
          image: ghcr.io/skpandey15/java-ai-mcp-interview-orchestrator
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: platform-config}
          env:
            - {name: DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: DATABASE_PASSWORD}}}
            - {name: AI_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: platform-secrets, key: AI_SERVICE_TOKEN}}}
            - {name: MCP_AUTHORIZATION_SECRET, valueFrom: {secretKeyRef: {name: platform-secrets, key: MCP_AUTHORIZATION_SECRET}}}
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: REDIS_PASSWORD}}}
            - {name: MINIO_ACCESS_KEY, valueFrom: {secretKeyRef: {name: platform-secrets, key: MINIO_ACCESS_KEY}}}
            - {name: MINIO_SECRET_KEY, valueFrom: {secretKeyRef: {name: platform-secrets, key: MINIO_SECRET_KEY}}}
            - {name: MAIL_USERNAME, valueFrom: {secretKeyRef: {name: platform-secrets, key: MAIL_USERNAME, optional: true}}}
            - {name: MAIL_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: MAIL_PASSWORD, optional: true}}}
            - {name: SPRING_FLYWAY_ENABLED, value: "false"}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, sleep 10]
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
spec:
  selector:
    app.kubernetes.io/name: web-ui
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-ui
    spec:
      serviceAccountName: platform-runtime
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web-ui
          image: ghcr.io/skpandey15/java-ai-mcp-web-ui
          command: [/usr/sbin/nginx]
          args: [-g, "daemon off;"]
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: web-ui-runtime-config
