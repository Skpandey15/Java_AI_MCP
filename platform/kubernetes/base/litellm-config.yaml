model_list:
  - model_name: interview-question-model
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  retry_after: 1
litellm_settings:
  drop_params: true
  request_timeout: 60
  set_verbose: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
