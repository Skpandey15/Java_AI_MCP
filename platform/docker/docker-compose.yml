services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    environment:
      POSTGRES_DB: online_interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    command: ["postgres", "-c", "max_connections=150", "-c", "shared_buffers=256MB"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d online_interview"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--requirepass", "${REDIS_PASSWORD:-local-redis-password}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-interview}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-minio-secret-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "8090:8080"
    volumes:
      - ./keycloak/online-interview-realm.json:/opt/keycloak/data/import/online-interview-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-local-litellm-key}
    ports:
      - "4000:4000"
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro

  web-ui:
    build:
      context: ../../apps/web-ui
    ports:
      - "3000:80"
    depends_on:
      interview-orchestrator:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  interview-orchestrator:
    build:
      context: ../../apps/interview-orchestrator
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${APP_ENVIRONMENT:-local}
      DATABASE_URL: jdbc:postgresql://postgres:5432/online_interview
      DATABASE_USERNAME: interview
      DATABASE_PASSWORD: interview
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-20}
      KEYCLOAK_ISSUER_URI: http://localhost:8090/realms/online-interview
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/online-interview/protocol/openid-connect/certs
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-ai-service-token}
      MCP_AUTHORIZATION_SECRET: ${MCP_AUTHORIZATION_SECRET:-local-mcp-authorization-secret-change-me}
      MCP_EXECUTION_TIMEOUT_SECONDS: ${MCP_EXECUTION_TIMEOUT_SECONDS:-10}
      MCP_CALLS_PER_MINUTE: ${MCP_CALLS_PER_MINUTE:-20}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MESSAGING_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
      OBJECT_STORAGE_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-interview}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-minio-secret-change-me}
      MINIO_KNOWLEDGE_BUCKET: knowledge-documents
      RAG_MINIMUM_SIMILARITY: ${RAG_MINIMUM_SIMILARITY:-0.55}
      RAG_RETRIEVAL_LIMIT: ${RAG_RETRIEVAL_LIMIT:-8}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      ai-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-service:
    build:
      context: ../../apps/ai-service
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LITELLM_BASE_URL: http://litellm:4000
      # Scoped virtual key for the AI workload; must NOT be the gateway master key.
      # Locally it defaults to the master key value so the keyless dev gateway accepts it;
      # in uat/prod set LITELLM_API_KEY to a budgeted virtual key minted by LiteLLM.
      LITELLM_API_KEY: ${LITELLM_API_KEY:-local-litellm-key}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-ai-service-token}
      INTERVIEW_QUESTION_MODEL: interview-question-model
      KNOWLEDGE_EMBEDDING_MODEL: knowledge-embedding-model
      INPUT_COST_PER_MILLION_TOKENS_USD: ${INPUT_COST_PER_MILLION_TOKENS_USD:-0.15}
      OUTPUT_COST_PER_MILLION_TOKENS_USD: ${OUTPUT_COST_PER_MILLION_TOKENS_USD:-0.60}
    ports:
      - "8000:8000"
    depends_on:
      litellm:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus-rules.yml:/etc/prometheus/rules/platform.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      interview-orchestrator:
        condition: service_healthy

  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ../observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ../observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.7.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ../observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
  tempo-data:
  kafka-data:
  redis-data:
  minio-data:
