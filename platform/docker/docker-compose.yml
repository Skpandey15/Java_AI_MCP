services:
  web-ui:
    build:
      context: ../../apps/web-ui
    ports:
      - "3000:80"
    depends_on:
      interview-orchestrator:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  interview-orchestrator:
    build:
      context: ../../apps/interview-orchestrator
    environment:
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  ai-service:
    build:
      context: ../../apps/ai-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
