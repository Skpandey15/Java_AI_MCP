global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: interview-orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["interview-orchestrator:8080"]
  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]
