apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: online-interview-dev
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-secret-store
  namespace: online-interview-dev
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: online-interview-dev
          serviceAccountRef:
            name: external-secrets-vault
            audiences:
              - vault
