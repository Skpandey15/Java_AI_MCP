# SonarQube Cloud (sonarcloud.io) analysis config. After importing this repo into SonarCloud,
# confirm these two keys match the project it created (organization is usually your GitHub
# login lowercased; projectKey is usually <organization>_<repo>).
sonar.projectKey=Skpandey15_Java_AI_MCP
sonar.organization=skpandey15

# --- analysis scope: our three services, excluding vendored/build output ---
sonar.sources=apps
sonar.exclusions=**/node_modules/**,**/.venv/**,**/build/**,**/dist/**,**/*.min.js,**/*.tsbuildinfo,**/site-packages/**,**/*.spdx.json

# Test code (kept separate from production sources so metrics aren't skewed).
sonar.tests=apps/interview-orchestrator/src/test,apps/ai-service/tests
sonar.test.inclusions=apps/web-ui/src/**/*.test.ts,apps/web-ui/src/**/*.test.tsx

# --- languages ---
sonar.java.source=25
# Java needs compiled classes; the sonarcloud workflow builds them before scanning.
sonar.java.binaries=apps/interview-orchestrator/build/classes/java/main
sonar.python.version=3.13

# --- coverage (produced by the sonarcloud workflow) ---
sonar.coverage.jacoco.xmlReportPaths=apps/interview-orchestrator/build/reports/jacoco/test/jacocoTestReport.xml
sonar.python.coverage.reportPaths=apps/ai-service/coverage.xml
